schema_version = 1

[policy]
project_license = "Apache-2.0"
compatible_licenses = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
required_components = [
  "exocomp",
  "erlang-otp",
  "elixir",
  "llama-cpp",
  "qwen2.5-1.5b-instruct-q4-k-m",
]

